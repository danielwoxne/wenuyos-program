# Gy25 – ämnet Matematik, nivå 1 (1a, 1b och 1c har gemensam kärna; 1c går längst).
# Målen är förkortade och omskrivna efter innehållsområdena i Skolverkets ämnesplan.
# Fördelningen mellan 1a/1b/1c är ungefärlig – kontrollera mot ämnesplanen innan
# programmet används i undervisning.
stadium = "gy25.1"

[[mal]]
