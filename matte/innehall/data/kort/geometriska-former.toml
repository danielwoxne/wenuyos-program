svar = "3"
ledtrad = "Räkna spetsarna."
losning = ["Lägg fingret i ett hörn och gå runt.", "Räkna varje hörn: ett, två, tre.", "En triangel har tre hörn."]

[[uppgift]]
niva = 2
fraga = "Vilken form har fyra lika långa sidor och fyra hörn?"
