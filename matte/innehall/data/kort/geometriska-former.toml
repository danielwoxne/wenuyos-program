alternativ = ["kvadrat", "triangel", "cirkel", "rektangel"]
ledtrad = "Rektangeln har också fyra hörn – men dess sidor är inte alla lika långa."
feltankar = { "rektangel" = "Nästan – en rektangel har fyra hörn, men bara motstående sidor är lika långa. Är ALLA fyra lika långa heter den kvadrat (en kvadrat är en särskild rektangel)." }
losning = ["Fyra hörn: kvadrat eller rektangel.", "Alla fyra sidor lika långa: kvadrat."]

[[uppgift]]
