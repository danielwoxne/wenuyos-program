[[uppgift]]
niva = 3
svarstyp = "val"
fraga = "Är en kvadrat en rektangel?"
alternativ = ["ja", "nej"]
svar = "ja"
ledtrad = "En rektangel är en fyrhörning där alla hörn är räta. Har kvadraten det?"
feltankar = { "nej" = "Kvadraten har fyra räta hörn – då är den en rektangel. Att sidorna är lika långa gör den till en särskild rektangel." }
losning = ["En rektangel har fyra räta hörn.", "Kvadraten har fyra räta hörn.", "Alltså är kvadraten en rektangel – med lika långa sidor."]

[[uppgift]]
niva = 3
fraga = "Du har {a} trianglar och {b} kvadrater. Hur många hörn är det tillsammans?"
svar = "{3*a+4*b}"
var = { a = "2..5", b = "1..4" }
ledtrad = "Trianglarna: {a} · 3. Kvadraterna: {b} · 4."
losning = ["Trianglarna: {a} · 3 = {3*a}.", "Kvadraterna: {b} · 4 = {4*b}.", "{3*a} + {4*b} = {3*a+4*b}."]

[[uppgift]]
niva = 2
svarstyp = "mala"
fraga = "Måla alla fyrhörningar gröna."
figur = { typ = "malrutor", kolumner = 6, ruta = 76, objekt = "{'|'.join('form:' + ['kvadrat','triangel','rektangel','cirkel','romb','femhorning'][(i*n)%6] for i in range(6))}", farger = ["grön"] }
svar = "{'|'.join('grön' if ['kvadrat','triangel','rektangel','cirkel','romb','femhorning'][(i*n)%6] in ('kvadrat','rektangel','romb') else '' for i in range(6))}"
var = { n = "[1,5]" }
ledtrad = "En fyrhörning har fyra hörn och fyra raka sidor. Räkna hörnen."
losning = ["Räkna hörnen på varje form.", "Kvadraten, rektangeln och romben har fyra hörn – de är fyrhörningar.", "Triangeln har tre, femhörningen fem och cirkeln inga."]

[[uppgift]]
niva = 3
svarstyp = "kryssa"
fraga = "Vilka påståenden stämmer om en kvadrat? Kryssa i alla."
alternativ = ["Den har fyra hörn", "Alla sidor är lika långa", "Den har tre sidor", "Den är en rektangel", "Den är rund"]
svar = ["Den har fyra hörn", "Alla sidor är lika långa", "Den är en rektangel"]
ledtrad = "En rektangel är en fyrhörning där alla hörn är räta. Gäller det kvadraten?"
feltankar = { "Den har tre sidor" = "Tre sidor har en triangel. En kvadrat har fyra.", "Den är rund" = "En kvadrat har raka sidor och hörn – den är inte rund." }
losning = ["En kvadrat har fyra hörn och fyra lika långa sidor.", "Alla hörnen är räta – därför är en kvadrat också en rektangel (en extra jämn sådan)."]
