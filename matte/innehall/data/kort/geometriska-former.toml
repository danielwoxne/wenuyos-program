id = "geometriska-former"
titel = "Former – hörn och sidor"
omrade = "geometri"
ikon = "triangel"
bild = "torget.jpg"
bildtext = "Torget är lagt med trianglar och kvadrater i ett stjärnmönster runt fontänen. Formerna finns överallt – räkna hörnen."
sager = "Man känner igen en form på hur många hörn och sidor den har, inte på hur den ligger eller vilken färg den har."
galler = "Alltid. En triangel som står på spetsen är fortfarande en triangel."
galler_inte = "”En kvadrat är ingen rektangel” stämmer inte. En rektangel är en fyrhörning med fyra räta hörn – och det har kvadraten. Kvadraten är en särskild sorts rektangel där alla sidor råkar vara lika långa."
kalla = "Van Hiele-nivåerna: från 'ser ut som' till egenskaper. Variation: samma form i olika lägen och storlekar."

