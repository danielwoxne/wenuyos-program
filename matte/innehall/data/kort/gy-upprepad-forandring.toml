id = "gy-upprepad-forandring"
titel = "Upprepad procentuell förändring"
omrade = "samband"
ikon = "spargris"
sager = "Ökar något med 5 % varje år blir det 1,05 gånger större varje år. Efter n år: startvärde · 1,05ⁿ."
galler = "När förändringen är lika många PROCENT varje gång (ränta på ränta, befolkning, värdeminskning)."
galler_inte = "Man kan inte addera procenten: 3 år med 10 % ökning är inte 30 % utan 1,1³ = 1,331, alltså 33,1 %."
forkunskap = ["procent-forandring", "potenser"]
ateruppta = ["procent-forandring"]
kalla = "Förändringsfaktor som modell för exponentiell förändring; regel som slutar gälla: procent adderas inte över flera steg."

[[rad]]
sager = "1 000 kr med 5 % ränta i 3 år"
figur = { typ = "tabell", rubriker = ["år", "kr"], rader = [[0, "1 000"], [1, "1 050"], [2, "1 102,50"], [3, "1 157,63"]], kolbredd = 110 }
skriver = ["1 000 · 1,05³ ≈ 1 157,63"]

[[uppgift]]
niva = 1
fraga = "{s} kr ökar med {p} % per år. Vilken förändringsfaktor gäller för ett år?"
svar = "{100+p}/100"
form = "decimal"
var = { s = "[1000, 2000, 5000]", p = "[2, 3, 4, 5, 10]" }
ledtrad = "100 % + {p} %."
losning = ["100 % + {p} % = {100+p} %.", "= {1+p/100}."]

[[uppgift]]
niva = 2
fraga = "{ts(s)} kr sätts in med {p} % ränta per år. Hur mycket finns efter {n} år? (avrunda till hela kronor)"
svar = "{s}*(1+{p}/100)^{n}"
tolerans = 0.5
var = { s = "[1000, 2000, 5000]", p = "[2, 3, 4, 5]", n = "2..5" }
ledtrad = "{s} · {1+p/100}^{n}"
feltankar = { "{s}+{s}*{p}*{n}/100" = "Det är {p} % av startbeloppet {n} gånger – men räntan växer av sig själv (ränta på ränta). Multiplicera med {1+p/100} varje år: {s} · {1+p/100}^{n}." }
losning = ["Förändringsfaktor: {1+p/100}.", "Efter {n} år: {s} · {1+p/100}^{n}.", "≈ {round(s*(1+p/100)**n)} kr."]

[[uppgift]]
niva = 3
fraga = "En bil kostar {ts(s)} kr och tappar {p} % i värde per år. Vad är den värd efter {n} år? (hela kronor)"
svar = "{s}*(1-{p}/100)^{n}"
tolerans = 0.5
var = { s = "[100000, 200000, 250000]", p = "[10, 15, 20]", n = "2..4" }
ledtrad = "Förändringsfaktorn är {1-p/100}. Upphöj till {n}."
feltankar = { "{s}*(1-{p*n}/100)" = "Procenten kan inte adderas över flera år. Varje år tappar bilen {p} % av det den är värd DÅ: {s} · {1-p/100}^{n}." }
losning = ["Förändringsfaktor: 1 − {p/100} = {1-p/100}.", "Efter {n} år: {s} · {1-p/100}^{n}.", "≈ {ts(round(s*(1-p/100)**n))} kr."]

[[rad]]
sager = "minskning med 20 % per år"
figur = { typ = "tabell", rubriker = ["år", "faktor", "andel kvar"], rader = [[1, "0,8", "80 %"], [2, "0,8² = 0,64", "64 %"], [3, "0,8³ ≈ 0,51", "51 %"]], kolbredd = 110 }
skriver = ["startvärde · 0,8ⁿ"]

[[rad]]
sager = "samma procent varje år ger en kurva, inte en linje"
skriver = ["50 kr, 52,50 kr, 55,13 kr …"]
kommentar = "Året 1 ger 5 % av 1 000 = 50 kr, år 2 ger 5 % av 1 050 = 52,50 kr. Räntan får ränta."

[[rad]]
sager = "tumregel: fördubblingstid"
skriver = ["ungefär 70 / p år"]
kommentar = "Med 5 % per år fördubblas beloppet på ungefär 14 år (1,05¹⁴ ≈ 1,98). Bara en uppskattning."

[[exempel]]
rubrik = "Ränta på ränta: 1 000 kr, 5 % i 3 år"
figur = { typ = "tabell", rubriker = ["år", "räkning", "kr"], rader = [[1, "1 000 · 1,05", "1 050"], [2, "1 050 · 1,05", "1 102,50"], [3, "1 102,50 · 1,05", "1 157,63"]], kolbredd = 130 }
steg = [
  "Varje år multipliceras beloppet med förändringsfaktorn 1,05.",
  "Tre år i rad: 1 000 · 1,05 · 1,05 · 1,05 = 1 000 · 1,05³.",
  "≈ 1 157,63 kr. Enkel ränta hade gett 1 150 kr – räntan på räntan är 7,63 kr.",
]

[[exempel]]
rubrik = "Värdeminskning: en bil tappar 15 % per år"
steg = [
  "Kvar varje år: 100 % − 15 % = 85 % – faktorn 0,85.",
  "Efter 4 år: 0,85⁴ ≈ 0,52. Bilen är värd ungefär halva nypriset.",
  "Inte 1 − 4 · 0,15 = 0,40 – varje år tappar den 15 % av det den är värd då, och det blir mindre och mindre.",
]

[[uppgift]]
niva = 1
fraga = "Följ stegen. {ts(s)} kr växer med {p} % per år. Hur mycket finns efter {n} år? (hela kronor)"
steg = ["Förändringsfaktor: 1 + {p}/100 = {1+p/100}", "Efter {n} år: {ts(s)} · {1+p/100}^{n} = ?"]
svar = "{s}*(1+{p}/100)^{n}"
tolerans = 0.5
var = { s = "[1000, 2000, 5000]", p = "[2, 4, 5, 10]", n = "2..4" }
ledtrad = "Räkna ut {1+p/100}^{n} först."
losning = ["{1+p/100}^{n} ≈ {round((1+p/100)**n, 4)}.", "{ts(s)} · {round((1+p/100)**n, 4)} ≈ {round(s*(1+p/100)**n)} kr."]

[[uppgift]]
niva = 2
fraga = "Befolkningen minskar med {p} % per år. Vilken förändringsfaktor gäller för ett år?"
svar = "{100-p}/100"
form = "decimal"
var = { p = "[1, 2, 3, 5, 8, 12]" }
ledtrad = "100 % − {p} %."
feltankar = { "{100+p}/100" = "Det är en minskning – procenten dras ifrån." }
losning = ["100 % − {p} % = {100-p} %.", "= {(100-p)/100}."]

[[uppgift]]
niva = 2
svarstyp = "val"
fraga = "Ett pris ökar med 10 % tre år i rad. Hur stor är den totala ökningen?"
alternativ = ["30 %", "33,1 %", "13,1 %"]
svar = "33,1 %"
form = "text"
ledtrad = "Förändringsfaktorn för tre år: 1,1³."
feltankar = { "30 %" = "Procent kan inte adderas över flera år – varje ökning räknas på det nya, högre priset. 1,1³ = 1,331." }
losning = ["1,1³ = 1,1 · 1,1 · 1,1 = 1,331.", "1,331 = 133,1 % av startpriset.", "Ökningen: 33,1 %."]

[[uppgift]]
niva = 3
fraga = "Hur många procent ökar ett belopp totalt på {n} år om det ökar med {p} % per år? Svara med en decimal (bara talet)."
svar = "((1+{p}/100)^{n}-1)*100"
tolerans = 0.05
var = { p = "[3, 5, 8, 10, 20]", n = "2..5" }
ledtrad = "Räkna ut förändringsfaktorn för {n} år och dra bort 1."
feltankar = { "{p*n}" = "Procenten adderas inte: {n} · {p} = {p*n} är för lite. Räkna med förändringsfaktorn {1+p/100}^{n}." }
losning = ["{1+p/100}^{n} ≈ {round((1+p/100)**n, 4)}.", "Ökningen: {round((1+p/100)**n, 4)} − 1 ≈ {round((1+p/100)**n - 1, 4)}.", "≈ {round(((1+p/100)**n - 1)*100, 1)} %."]

[[uppgift]]
niva = 3
fraga = "Ett belopp växer med {p} % per år. Efter hur många hela år har det minst fördubblats?"
svar = "{[k for k in range(1, 100) if (1+p/100)**k >= 2][0]}"
var = { p = "[5, 7, 8, 10, 12, 15]" }
ledtrad = "Pröva: {1+p/100}^n – när blir det minst 2? (Tumregel: ungefär 70 / {p} år.)"
losning = ["Fördubbling: {1+p/100}^n ≥ 2.", "Pröva n = {[k for k in range(1, 100) if (1+p/100)**k >= 2][0] - 1}: {round((1+p/100)**([k for k in range(1, 100) if (1+p/100)**k >= 2][0] - 1), 3)} – inte än.", "n = {[k for k in range(1, 100) if (1+p/100)**k >= 2][0]}: {round((1+p/100)**[k for k in range(1, 100) if (1+p/100)**k >= 2][0], 3)} ≥ 2."]
