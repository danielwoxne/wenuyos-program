ikon = "triangel"
bild = "torget.jpg"
bildtext = "Torget är fullt av former: trianglar i stenläggningen, rektanglar i fönstren, en cirkel runt fontänen."
sager = "Cirkeln är rund. Kvadraten har fyra lika långa sidor. Triangeln har tre hörn."
galler = "Formen är densamma hur den än vänds, hur stor den är och vilken färg den har."
galler_inte = "En triangel behöver inte stå på sin breda sida eller ha lika långa sidor. Allt som har tre raka sidor och tre hörn är en triangel – även en smal, sned eller upp-och-nedvänd."
kalla = "Van Hiele nivå 0–1: från helhetsintryck till egenskaper (hörn och sidor). Visa formerna i många lägen så att barnet inte bara känner igen en ”typbild” (Clements)."

