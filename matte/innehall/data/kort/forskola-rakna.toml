[[exempel]]
rubrik = "Så räknar vi fem äpplen"
figur = { typ = "ikoner", namn = "apple", antal = 5 }
steg = [
  "Peka på det första äpplet och säg: ett.",
  "Peka på nästa och säg: två. Varje äpple får ett eget tal.",
  "Fortsätt: tre, fyra, fem. Inget äpple räknas två gånger.",
  "Det sista talet du sa var fem. Alltså är det fem äpplen.",
]

[[exempel]]
rubrik = "En full rad är fem"
