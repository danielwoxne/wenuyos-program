id = "forskola-rakna"
titel = "Hur många?"
omrade = "tal"
ikon = "apple"
bild = "applen-fat-brada.jpg"
bildtext = "Fem äpplen på fatet och två på brädan. Räkna dem tillsammans: ett, två, tre …"
sager = "Räkna en sak i taget. Det sista talet du säger är hur många det är."
galler = "Alltid. Det spelar ingen roll om du börjar från vänster eller höger, eller om sakerna ligger tätt eller glest – antalet är detsamma."
galler_inte = "Räkna aldrig samma sak två gånger, och hoppa inte över någon. Peka eller flytta varje sak när du räknar den – då håller du ordning."
kalla = "Räkneprinciperna (Gelman & Gallistel): ett tal per sak, alltid samma ordning, det sista talet är antalet. Subitisering – se små antal direkt (Clements). Konkret material först: tioramen och dina egna fingrar."

