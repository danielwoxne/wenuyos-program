fraga = "Dra en linje mellan klockslaget i ord och i siffror."
par = [["klockan {h}", "{h}:00"], ["kvart över {h}", "{h}:15"], ["halv {h+1}", "{h}:30"], ["kvart i {h+1}", "{h}:45"]]
var = { h = "1..10" }
ledtrad = "Halv {h+1} betyder en halvtimme kvar till {h+1} – alltså {h}:30."
feltankar = { "halv {h+1} → {h}:15" = "Halv {h+1} är en halvtimme före {h+1}, alltså {h}:30.", "kvart i {h+1} → {h}:15" = "Kvart i {h+1} är en kvart före {h+1}: {h}:45. Kvart över {h} är {h}:15." }
losning = ["Klockan {h} = {h}:00.", "Kvart över {h} = {h}:15.", "Halv {h+1} = {h}:30 – halvvägs till {h+1}.", "Kvart i {h+1} = {h}:45."]
