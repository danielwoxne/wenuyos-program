# Regelkort: bråk som delar av en hel
# Förlagan: sidan "Bråk 2" i regelboken – man säger / bild / man skriver.

id = "brak-delar"
titel = "Bråk – delar av en hel"
omrade = "tal"
ikon = "fjardedelar"
bild = "pizza-attondelar.jpg"
bildtext = "Pizzan är delad i åtta lika stora bitar. Två ligger på brädan – sex åttondelar är kvar: 6/8."
sager = "Ett bråk säger hur många lika stora delar helheten är delad i, och hur många av dem vi menar."
galler = "När helheten är delad i LIKA stora delar. Är delarna olika stora är det inget bråk."
galler_inte = "”Större nämnare ger större bråk” stämmer inte. 1/8 är mindre än 1/5 – ju fler delar helheten delas i, desto mindre blir varje del."
kalla = "Konkret → bild → symbol (CRA). Variationsteori: samma längd på helheten, bara antalet delar varierar."

[[rad]]
sager = "en hel"
figur = { typ = "stapel", delar = 1, fyllda = 1, farg = "gul" }
skriver = ["1", "1/1"]

[[rad]]
sager = "en halv"
figur = { typ = "stapel", delar = 2, fyllda = 1, farg = "bla" }
skriver = ["1/2"]

[[rad]]
sager = "en tredjedel"
figur = { typ = "stapel", delar = 3, fyllda = 1, farg = "rosa" }
skriver = ["1/3"]

[[rad]]
sager = "en fjärdedel"
figur = { typ = "stapel", delar = 4, fyllda = 1, farg = "gron" }
skriver = ["1/4"]

[[rad]]
sager = "en femtedel"
figur = { typ = "stapel", delar = 5, fyllda = 1, farg = "ljusgul" }
skriver = ["1/5"]

[[rad]]
sager = "en sjättedel"
figur = { typ = "stapel", delar = 6, fyllda = 1, farg = "himmel" }
skriver = ["1/6"]

[[rad]]
sager = "en sjundedel"
figur = { typ = "stapel", delar = 7, fyllda = 1, farg = "sand" }
skriver = ["1/7"]

[[rad]]
sager = "en åttondel"
figur = { typ = "stapel", delar = 8, fyllda = 1, farg = "aprikos" }
skriver = ["1/8"]

[[rad]]
