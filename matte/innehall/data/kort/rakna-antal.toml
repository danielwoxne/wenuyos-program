svar = "{n}"
var = { n = "6..10" }
ledtrad = "Första raden är fem. Räkna vidare från fem: sex, sju …"
feltankar = { "{n-1}" = "Nära! Du missade en. Prova att räkna raderna: fem i första raden och sedan resten.", "{n+1}" = "Du räknade en för mycket. Peka på varje prick bara en gång." }
losning = ["Den första raden har fem prickar – det ser du utan att räkna.", "Räkna vidare på nästa rad: {', '.join(str(i) for i in range(6, n+1))}.", "Det blir {n}."]

[[uppgift]]
