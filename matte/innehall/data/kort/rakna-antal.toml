ledtrad = "Baklänges blir talen ett mindre varje gång."
feltankar = { "{n-1}" = "Det talet har redan kommit. Fortsätt baklänges från {n-2}." }
losning = ["Baklänges: varje tal är ett mindre än det förra.", "Efter {n-2} kommer {n-3}."]

[[uppgift]]
niva = 2
svarstyp = "val"
fraga = "Vilket tal är störst?"
