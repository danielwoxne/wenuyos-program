svar = "{max(a,b)}{min(a,b)}"
var = { a = "1..9", b = "1..9 != a" }
ledtrad = "Titta på den första siffran – den säger hur många tiotal."
feltankar = { "{min(a,b)}{max(a,b)}" = "Titta på tiotalssiffran först – den står först. {max(a,b)} tiotal är mer än {min(a,b)} tiotal, hur stora entalen än är." }
losning = ["Den första siffran är tiotalen.", "{max(a,b)}{min(a,b)} har {max(a,b)} tiotal, {min(a,b)}{max(a,b)} har bara {min(a,b)}.", "Flest tiotal vinner: {max(a,b)}{min(a,b)}."]

