id = "rakna-antal"
titel = "Räkna antal"
omrade = "tal"
ikon = "apple"
bild = "jordgubbar-tallrikar.jpg"
bildtext = "Två, fyra och sex jordgubbar. Peka på en i taget och räkna – det sista talet är hur många."
sager = "Varje sak räknas en gång. Det sista talet du säger är hur många det är."
galler = "Alltid – det spelar ingen roll i vilken ordning du räknar."
galler_inte = "Att räkna en och en fungerar alltid, men vid stora antal blir det långsamt och lätt fel. Från ungefär tio lönar det sig att räkna i grupper: fem i taget, tio i taget."
kalla = "Gelman & Gallistel: räkneprinciperna (ett-till-ett, stabil ordning, kardinaltal). Fem-struktur (Fuson) – rader om fem så man ser antalet utan att räkna varje."

[[rad]]
sager = "tre"
figur = { typ = "ikoner", namn = "apple", antal = 3 }
skriver = ["3"]

[[rad]]
sager = "fem"
figur = { typ = "prickar", antal = 5 }
skriver = ["5"]

[[rad]]
sager = "åtta"
figur = { typ = "prickar", antal = 8 }
skriver = ["8"]
kommentar = "Fem i första raden och tre till – åtta. Man behöver inte räkna en och en."

[[uppgift]]
niva = 1
fraga = "Hur många äpplen är det?"
figur = { typ = "ikoner", namn = "apple", antal = "{n}" }
svar = "{n}"
var = { n = "1..5" }
ledtrad = "Peka på ett äpple i taget och räkna: ett, två, tre …"
losning = ["Peka på ett äpple i taget.", "Säg ett tal för varje äpple.", "Det sista talet är svaret: {n}."]

[[uppgift]]
niva = 2
fraga = "Hur många prickar är det?"
