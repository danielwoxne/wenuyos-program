id = "forskola-monster"
titel = "Vad kommer sedan?"
omrade = "algebra"
ikon = "stjarna"
bild = "monster-brickor.jpg"
bildtext = "Blå, gul, röd – blå, gul, röd. Säg mönstret högt!"
sager = "I ett mönster upprepas samma sak om och om igen. Säg mönstret högt: cirkel, kvadrat, cirkel, kvadrat …"
galler = "När samma ordning kommer tillbaka hela tiden. Den del som upprepas kallas mönstrets kärna."
galler_inte = "Alla mönster upprepas inte. Ett växande mönster – 1, 2, 3, 4 … – blir större för varje steg. Då letar man efter hur mycket det växer, inte efter en kärna."
kalla = "Mönster som tidig algebra: hitta kärnan, säg den högt, fortsätt den (Clements & Sarama; Lpfö 18: ordning och mönster)."

[[rad]]
sager = "cirkel, kvadrat, cirkel, kvadrat"
figur = { typ = "ikonval", fore = ["cirkel", "kvadrat", "cirkel", "kvadrat"], ikoner = [], d = 1 }
skriver = ["A B A B"]

[[rad]]
sager = "äpple, banan, banan – och igen"
figur = { typ = "ikonval", fore = ["apple", "banan", "banan", "apple", "banan", "banan"], ikoner = [], d = 1 }
skriver = ["A B B A B B"]

[[exempel]]
rubrik = "Hitta kärnan"
figur = { typ = "ikonval", fore = ["apple", "banan", "banan", "apple", "banan", "banan"], ikoner = [], d = 1 }
steg = [
  "Säg högt: äpple, banan, banan, äpple, banan, banan …",
  "Det som upprepas är äpple – banan – banan. Det är mönstrets kärna.",
  "När kärnan är slut börjar den om. Nästa sak blir ett äpple.",
]

[[exempel]]
rubrik = "Ett mönster som växer"
figur = { typ = "ikonval", fore = ["siffra-1", "siffra-2", "siffra-3", "siffra-4"], ikoner = [], d = 1 }
steg = [
  "1, 2, 3, 4 – varje gång blir det en till.",
  "Inget upprepas. Mönstret växer.",
  "Nästa blir 5.",
]

