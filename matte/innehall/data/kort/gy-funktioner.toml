id = "gy-funktioner"
titel = "Funktioner – f(x)"
omrade = "samband"
ikon = "linjediagram"
sager = "f(x) är en regel som ger ett värde för varje x. f(3) betyder: sätt in 3 överallt där det står x."
galler = "Alltid. f(3) är ett tal, inte 'f gånger 3'."
galler_inte = "f(x) är inte f gånger x. Och f(a + b) är oftast inte f(a) + f(b): med f(x) = x² är f(1 + 2) = f(3) = 9, men f(1) + f(2) = 1 + 4 = 5."
forkunskap = ["linjara-funktioner"]
kalla = "Funktionsmaskinen (in–ut) och värdetabellen som brygga mellan formel och graf."

[[rad]]
sager = "f(x) = 2x + 3"
figur = { typ = "tabell", rubriker = ["x", "0", "1", "2", "3"], rader = [["f(x)", 3, 5, 7, 9]], kolbredd = 60 }
skriver = ["f(3) = 2 · 3 + 3 = 9"]

[[uppgift]]
niva = 1
fraga = "f(x) = {a}x + {b}. Vad är f({c})?"
svar = "{a*c+b}"
var = { a = "2..6", b = "1..9", c = "1..6" }
ledtrad = "Byt x mot {c}: {a} · {c} + {b}."
feltankar = { "{a+c+b}" = "{a}x betyder {a} GÅNGER x: {a} · {c} + {b}." }
losning = ["Byt x mot {c}.", "{a} · {c} + {b} = {a*c} + {b}.", "f({c}) = {a*c+b}."]

[[uppgift]]
niva = 2
fraga = "f(x) = x² − {a}x. Vad är f({c})?"
svar = "{c*c-a*c}"
var = { a = "1..6", c = "-3..5 != 0" }
ledtrad = "{c}² − {a} · {c}. Var försiktig med tecknen."
feltankar = { "{-(c*c)-a*c if c < 0 else c*c+a*c}" = "Kontrollera tecknen: ({c})² är {c*c} (positivt), och − {a} · ({c})." }
losning = ["Byt x mot ({c}).", "({c})² − {a} · ({c}) = {c*c} {t(-a*c)}.", "f({c}) = {c*c-a*c}."]

[[uppgift]]
niva = 3
fraga = "f(x) = {a}x − {b}. För vilket x är f(x) = {a*s-b}?"
svar = "{s}"
var = { a = "2..6", b = "1..9", s = "1..8" }
ledtrad = "Lös ekvationen {a}x − {b} = {a*s-b}."
feltankar = { "{a*(a*s-b)-b}" = "Du räknade f({a*s-b}). Frågan är omvänd: vilket x ger värdet {a*s-b}? Lös {a}x − {b} = {a*s-b}." }
losning = ["Sätt f(x) = {a*s-b}: {a}x − {b} = {a*s-b}.", "{a}x = {a*s}.", "x = {s}."]

[[rad]]
sager = "funktionsmaskinen"
figur = { typ = "tabell", rubriker = ["in: x", "regel", "ut: f(x)"], rader = [["2", "· 2 + 3", "7"], ["5", "· 2 + 3", "13"]], kolbredd = 100 }
skriver = ["varje x ger exakt ett värde"]

[[rad]]
sager = "f(0) och grafen"
skriver = ["f(0) = skärning med y-axeln"]
kommentar = "För f(x) = 2x + 3 är f(0) = 3 – samma som m i y = kx + m."

[[rad]]
sager = "f(x) = x²"
figur = { typ = "tabell", rubriker = ["x", "−2", "−1", "0", "1", "2"], rader = [["f(x)", 4, 1, 0, 1, 4]], kolbredd = 50 }
skriver = ["f(−2) = (−2)² = 4"]
kommentar = "Sätt alltid in negativa tal inom parentes."

[[exempel]]
rubrik = "f(x) = x² − 3x, f(−2)"
steg = [
  "Byt varje x mot (−2) – med parentes.",
  "f(−2) = (−2)² − 3 · (−2) = 4 + 6.",
  "f(−2) = 10.",
]

[[exempel]]
rubrik = "Åt andra hållet: när är f(x) = 11?"
text = "f(x) = 2x + 3"
steg = [
  "Nu är värdet känt, inte x. Skriv en ekvation: 2x + 3 = 11.",
  "2x = 8, x = 4.",
  "Kontroll: f(4) = 2 · 4 + 3 = 11.",
]

[[uppgift]]
niva = 1
fraga = "Följ stegen. f(x) = {a}x + {b}. Vad är f({c})?"
steg = ["Byt varje x mot {c}: f({c}) = {a} · {c} + {b}", "= ?"]
svar = "{a*c+b}"
var = { a = "2..6", b = "1..9", c = "1..6" }
ledtrad = "{a*c} + {b}."
losning = ["{a} · {c} = {a*c}.", "{a*c} + {b} = {a*c+b}."]

[[uppgift]]
niva = 2
svarstyp = "tabell"
fraga = "f(x) = x² {t(b)}. Fyll i värdetabellen."
falt = ["f(−1)", "f(0)", "f(2)"]
svar = ["{1+b}", "{b}", "{4+b}"]
var = { b = "-5..5 != 0" }
ledtrad = "(−1)² = 1."
feltankar = { "{-1+b};{b};{4+b}" = "(−1)² = (−1) · (−1) = +1, inte −1." }
losning = ["f(−1) = (−1)² {t(b)} = 1 {t(b)} = {1+b}.", "f(0) = 0 {t(b)} = {b}.", "f(2) = 4 {t(b)} = {4+b}."]

[[uppgift]]
niva = 2
fraga = "Läs av f({x}) i grafen."
figur = { typ = "koordinatsystem", xmin = -1, xmax = 6, ymin = -1, ymax = 8, ruta = 26, linje = ["{k}", "{m}"] }
svar = "{k*x+m}"
var = { k = "[1, 2]", m = "0..2", x = "1..3" }
ledtrad = "Gå till x = {x}, upp till linjen, åt vänster till y-axeln."
losning = ["Hitta x = {x} på x-axeln.", "Gå rakt upp till linjen.", "Läs av y: f({x}) = {k*x+m}."]

[[uppgift]]
niva = 2
svarstyp = "val"
fraga = "Betyder f(3) samma sak som f · 3?"
alternativ = ["ja", "nej"]
svar = "nej"
form = "text"
ledtrad = "f är ett namn på en regel, inte ett tal."
feltankar = { "ja" = "f är namnet på funktionen, inget tal. f(3) betyder: värdet när x = 3." }
losning = ["f är funktionens namn.", "f(3) = värdet av funktionen när x = 3."]

[[uppgift]]
niva = 3
svarstyp = "tabell"
fraga = "f(x) = x². Räkna ut f({a}) + f({b}) och f({a} + {b})."
falt = ["f({a}) + f({b})", "f({a+b})"]
svar = ["{a*a+b*b}", "{(a+b)**2}"]
var = { a = "1..5", b = "1..5" }
ledtrad = "Räkna varje uttryck för sig. Blir de lika?"
losning = ["f({a}) + f({b}) = {a*a} + {b*b} = {a*a+b*b}.", "f({a+b}) = {a+b}² = {(a+b)**2}.", "Inte lika – f(a + b) ≠ f(a) + f(b)."]
