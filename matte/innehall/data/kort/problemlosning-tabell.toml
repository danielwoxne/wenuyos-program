id = "problemlosning-tabell"
titel = "Problemlösning – pröva systematiskt"
omrade = "problem"
ikon = "gloidlampa"
sager = "När du inte ser svaret direkt: gissa, kontrollera, justera. Skriv prövningarna i en tabell så ser du mönstret."
galler = "Alla problem. Tabellen gör att du inte provar samma sak två gånger – och ofta ser du regeln innan du är klar."
galler_inte = "Att gissa och pröva är ingen fuskmetod – men slumpmässiga gissningar är det. Ändra en sak i taget och skriv ner varje försök, annars ser du aldrig åt vilket håll du ska justera."
forkunskap = ["problemlosning-rita", "ekvationer-enkla"]
kalla = "Heuristiker (Pólya, Schoenfeld): pröva systematiskt, hitta mönstret, generalisera."

[[rad]]
sager = "Hönor och kaniner: 10 djur, 28 ben. Hur många av varje?"
figur = { typ = "tabell", rubriker = ["hönor", "kaniner", "ben"], rader = [[5, 5, 30], [6, 4, 28]], kolbredd = 90 }
skriver = ["6 hönor, 4 kaniner"]
kommentar = "Först gissa 5 och 5: 30 ben, för många. Byt en kanin mot en höna: 28. Klart."

[[uppgift]]
niva = 1
fraga = "{h} hönor och {k} kaniner. Hur många ben?"
figur = { typ = "tabell", rubriker = ["hönor", "kaniner", "ben"], rader = [["{h}", "{k}", "?"]], kolbredd = 90 }
svar = "{2*h+4*k}"
var = { h = "1..6", k = "1..6" }
ledtrad = "Hönor har 2 ben, kaniner 4."
losning = ["Hönorna: {h} · 2 = {2*h}.", "Kaninerna: {k} · 4 = {4*k}.", "{2*h} + {4*k} = {2*h+4*k}."]

[[uppgift]]
niva = 2
fraga = "{h+k} djur, hönor och kaniner, har tillsammans {2*h+4*k} ben. Hur många kaniner?"
svar = "{k}"
var = { h = "1..6", k = "1..6" }
ledtrad = "Om alla vore hönor: {2*(h+k)} ben. Varje kanin ger 2 ben extra. Hur många extra ben finns det?"
feltankar = { "{h}" = "Det är antalet hönor. Kontrollera: {h} kaniner och {k} hönor ger {4*h+2*k} ben, inte {2*h+4*k}." }
losning = ["Om alla vore hönor: {h+k} · 2 = {2*(h+k)} ben.", "Det finns {2*h+4*k} − {2*(h+k)} = {2*k} ben extra.", "Varje kanin ger 2 extra: {2*k} / 2 = {k} kaniner."]

[[uppgift]]
niva = 3
fraga = "Tre tal i rad (som 4, 5, 6) har summan {3*n+3}. Vilket är det minsta?"
svar = "{n}"
var = { n = "3..30" }
ledtrad = "Gissa ett tal, räkna summan, justera. Eller: mittentalet är summan delat med 3."
feltankar = { "{n+1}" = "Det är mittentalet. Det minsta är ett mindre." }
losning = ["Mittentalet = summan / 3 = {n+1}.", "Det minsta är ett mindre: {n}."]

[[uppgift]]
niva = 2
svarstyp = "skiss"
fraga = "Ett staket är {n} meter långt med en stolpe varje meter, även i båda ändarna. Hur många stolpar? Rita staketet."
svar = "{n+1}"
var = { n = "4..12" }
ledtrad = "Rita stolparna. Räkna mellanrummen och stolparna var för sig."
feltankar = { "{n}" = "Klassiskt! {n} meter ger {n} mellanrum – men stolparna är en fler, för det står en i varje ände. Rita och räkna." }
losning = ["{n} meter ger {n} mellanrum.", "En stolpe i början och en efter varje mellanrum.", "{n} + 1 = {n+1}."]

[[exempel]]
rubrik = "Hönor och kaniner"
figur = { typ = "tabell", rubriker = ["hönor", "kaniner", "ben", "jämfört med 28"], rader = [[5, 5, 30, "2 för många"], [6, 4, 28, "rätt!"]], kolbredd = 110 }
steg = [
  "10 djur och 28 ben. Gissa: 5 hönor och 5 kaniner ger 30 ben – för många.",
  "Byt en kanin mot en höna: 2 ben färre. 6 och 4 ger 28.",
  "Mönstret: varje byte ändrar med 2 ben. Det kunde ha räknats ut direkt.",
]

[[exempel]]
rubrik = "Handskakningar – hitta mönstret"
figur = { typ = "tabell", rubriker = ["personer", "handskakningar"], rader = [[2, 1], [3, 3], [4, 6], [5, 10]], kolbredd = 120 }
steg = [
  "Pröva små fall först och skriv in dem i tabellen.",
  "Varje ny person skakar hand med alla som redan är där: +1, +2, +3, +4.",
  "Med n personer: n · (n − 1) / 2. Tio personer: 10 · 9 / 2 = 45.",
]

[[uppgift]]
niva = 1
fraga = "Följ tabellen. {h+k} djur, hönor och kaniner, har {2*h+4*k} ben. Hur många kaniner?"
steg = ["Alla hönor: {h+k} hönor, 0 kaniner → {2*(h+k)} ben", "Varje kanin i stället för en höna ger +2 ben", "Vi behöver {2*k} ben till → ? kaniner"]
svar = "{k}"
var = { h = "1..6", k = "1..6" }
ledtrad = "{2*k} / 2."
losning = ["{2*k} extra ben / 2 = {k} kaniner."]

[[uppgift]]
niva = 2
fraga = "Två tal har summan {a+b} och skillnaden {a-b}. Vilket är det största talet?"
svar = "{a}"
var = { b = "2..20", a = "b+1..30" }
ledtrad = "Pröva: gissa det största, räkna ut det minsta, kontrollera skillnaden."
losning = ["Summan + skillnaden = två gånger det största: {a+b} + {a-b} = {2*a}.", "Det största: {2*a} / 2 = {a}.", "Kontroll: {a} + {b} = {a+b} och {a} − {b} = {a-b}."]

[[uppgift]]
niva = 2
fraga = "{n} personer hälsar på varandra. Alla skakar hand med alla en gång. Hur många handskakningar blir det?"
svar = "{n*(n-1)//2}"
var = { n = "4..10" }
ledtrad = "Pröva med 2, 3 och 4 personer först. Vad händer när en person till kommer?"
feltankar = { "{n*(n-1)}" = "Du räknade varje handskakning två gånger – när A skakar hand med B är det samma som B med A. Dela med 2." }
losning = ["Varje person skakar hand med {n-1} andra: {n} · {n-1} = {n*(n-1)}.", "Men då räknas varje handskakning två gånger.", "{n*(n-1)} / 2 = {n*(n-1)//2}."]

[[uppgift]]
niva = 3
fraga = "Du har {a} mynt, femkronor och enkronor, värda {5*f+a-f} kr tillsammans. Hur många femkronor?"
svar = "{f}"
var = { a = "6..15", f = "1..a-1" }
ledtrad = "Om alla vore enkronor: {a} kr. Varje femkrona ger 4 kr extra."
losning = ["Alla enkronor: {a} kr.", "Extra: {5*f+a-f} − {a} = {4*f} kr.", "Varje femkrona ger 4 kr extra: {4*f} / 4 = {f}."]

[[uppgift]]
niva = 3
fraga = "Ett staket är {n*d} meter långt med en stolpe var {d}:e meter, även i båda ändarna. Hur många stolpar?"
svar = "{n+1}"
var = { d = "2..5", n = "3..10" }
ledtrad = "Hur många mellanrum? Sedan en stolpe till."
feltankar = { "{n}" = "{n} är antalet mellanrum. Stolparna är en fler." }
losning = ["Mellanrum: {n*d} / {d} = {n}.", "Stolpar: {n} + 1 = {n+1}."]

[[uppgift]]
niva = 2
fraga = "En biobiljett kostar {b} kr och popcorn {p} kr. {n} kompisar köper var sin biljett och delar på {k} popcorn. Vad kostar det tillsammans?"
figur = { typ = "tabell", rubriker = ["vad", "antal", "pris", "summa"], rader = [["biljett", "{n}", "{b}", "?"], ["popcorn", "{k}", "{p}", "?"]], kolbredd = 80 }
svar = "{n*b+k*p}"
var = { b = "[80, 90, 100, 110]", p = "[30, 40, 45]", n = "2..5", k = "1..2" }
ledtrad = "Räkna en rad i taget: antal gånger pris. Lägg sedan ihop."
losning = ["Biljetter: {n} · {b} = {n*b} kr.", "Popcorn: {k} · {p} = {k*p} kr.", "Tillsammans: {n*b} + {k*p} = {n*b+k*p} kr."]

[[uppgift]]
niva = 3
fraga = "Ett bord har 4 stolar. Två bord i rad har 6 stolar, tre bord har 8. Hur många stolar får plats vid {n} bord i rad?"
figur = { typ = "tabell", rubriker = ["bord", "stolar"], rader = [["1", "4"], ["2", "6"], ["3", "8"], ["{n}", "?"]], kolbredd = 90 }
svar = "{2*n+2}"
var = { n = "5..12" }
ledtrad = "Varje nytt bord ger 2 stolar till. Hur många är det från början?"
feltankar = { "{4*n}" = "När borden står i rad försvinner stolarna där borden möts. Titta i tabellen: det blir 2 till för varje bord." }
losning = ["Tabellen ökar med 2 för varje bord.", "Stolar = 2 · bord + 2.", "2 · {n} + 2 = {2*n+2}."]
