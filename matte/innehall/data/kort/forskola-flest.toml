[[uppgift]]
niva = 2
svarstyp = "valj"
fraga = "Två rutor har lika många. Klicka på den som INTE har lika många."
figur = { typ = "grupper", namn = "kaka", antal = ["{[[a,a,b],[a,b,a],[b,a,a]][p][0]}", "{[[a,a,b],[a,b,a],[b,a,a]][p][1]}", "{[[a,a,b],[a,b,a],[b,a,a]][p][2]}"] }
