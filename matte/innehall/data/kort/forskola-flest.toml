id = "forskola-flest"
titel = "Flest och färst"
omrade = "tal"
ikon = "kaka"
bild = "jordgubbar-tallrikar.jpg"
bildtext = "Vilken tallrik har flest jordgubbar? Och vilken har färst?"
sager = "Där det finns flest är det mest att räkna. Lägg sakerna bredvid varandra så syns det."
galler = "När man jämför samma sorts saker – eller när man räknar sakerna, inte hur stora de är."
galler_inte = "”Störst” och ”flest” är inte samma sak. Två stora apelsiner är färre än fyra små jordgubbar. Och saker som ligger utspridda är inte fler än samma saker i en hög."
kalla = "Jämföra mängder med en-till-en-korrespondens och räkning (Piaget: antalets konstans; Clements & Sarama)."

[[rad]]
sager = "tre och fem – fem är flest"
figur = { typ = "grupper", namn = "kaka", antal = [3, 5] }
skriver = ["3 < 5"]

[[rad]]
sager = "lika många"
figur = { typ = "grupper", namn = "apple", antal = [4, 4] }
skriver = ["4 = 4"]

[[exempel]]
rubrik = "Lägg bredvid varandra"
figur = { typ = "grupper", namn = "kaka", antal = [3, 5] }
steg = [
  "Ta en kaka från varje grupp och lägg dem bredvid varandra – ett par.",
  "Gör så tills en grupp är slut. Vänster tar slut efter tre par.",
  "Höger har två kakor kvar. Den som har kvar har flest: fem är fler än tre.",
]

[[exempel]]
rubrik = "Stora saker är inte fler"
figur = { typ = "ikonval", fore = ["apelsin", "apelsin"], fore_namn = "jordgubbe", fore_antal = 4, ikoner = [], d = 1 }
steg = [
  "Två apelsiner och fyra jordgubbar.",
  "En apelsin är mycket större än en jordgubbe – men räkna: ett, två.",
  "Jordgubbarna: ett, två, tre, fyra. Jordgubbarna är flest.",
]

[[uppgift]]
niva = 1
svarstyp = "valj"
fraga = "Klicka där det finns flest kakor."
figur = { typ = "grupper", namn = "kaka", antal = ["{a}", "{b}"] }
svar = "{'första' if a > b else 'andra'}"
var = { a = "1..6", b = "1..6 != a" }
ledtrad = "Räkna i båda rutorna."
losning = ["Räkna den första rutan: {a}.", "Räkna den andra rutan: {b}.", "{max(a,b)} är fler än {min(a,b)}."]

[[uppgift]]
niva = 1
svarstyp = "valj"
fraga = "Räkna med mig. Klicka där det finns flest."
steg = ["Den första: {', '.join(str(i) for i in range(1, a+1))}.", "Den andra: {', '.join(str(i) for i in range(1, b+1))}."]
figur = { typ = "grupper", namn = "apple", antal = ["{a}", "{b}"] }
svar = "{'första' if a > b else 'andra'}"
var = { a = "1..6", b = "1..6 != a" }
ledtrad = "Vilken grupp kom längst när vi räknade?"

[[uppgift]]
niva = 1
svarstyp = "valj"
