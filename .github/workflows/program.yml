name: Program
# Det gemensamma programförrådet: en mapp per program (matte/, klossregn/ …).
#  - PR och push till main: varje program som ändrats provas (wenuyos verify för C++, paketeras för alla).
#  - Taggen <program>-v<version> (t.ex. matte-v0.3): programmet byggs, signeras med programnyckeln och släpps
#    som GitHub Release med <program>.wapp. WenuyOS hittar det med källan github.com/<ägare>/<förråd>#<program>.
#  - Taggen <program>-v<version>-osignerad (t.ex. matte-v0.4-osignerad): samma, men utan signatur – datorerna visar
#    "Inte signerat" när det installeras. För provversioner; programnyckeln behövs inte.
#  - Grenen slapp/<tagg> (t.ex. slapp/matte-v0.3) gör samma sak – för AI-assistenter som får skicka grenar men inte
#    taggar. Bara kod som redan finns på main släpps; kontrollen sätter taggen, släpper och tar bort grenen.
# Taggen/grenen sätts först när Daniel godkänt (docs/ARBETSORDNING.md avsnitt 10 i New-wenuyos).
on:
  push:
    branches: [main, 'slapp/**']
    tags: ['*-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: program-${{ github.ref }}
  cancel-in-progress: false
jobs:
  program:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Verktyg
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl gpg gpg-agent gpgv python3 cmake g++ make \
            pkgconf binutils labwc grim fonts-dejavu-core adwaita-icon-theme >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: WenuyOS SDK
        run: |
          base=https://github.com/danielwoxne/wenuyos-uppdateringar/releases/download/sdk
          curl -fsSLO "$base/wenuyos-sdk-debian13.tar.gz" -fsSLO "$base/wenuyos-sdk-debian13.tar.gz.sig"
          gpgv --keyring "$PWD/.github/wenuyos-update.gpg" wenuyos-sdk-debian13.tar.gz.sig wenuyos-sdk-debian13.tar.gz
          tar -xzf wenuyos-sdk-debian13.tar.gz -C / && rm wenuyos-sdk-debian13.tar.gz* && ldconfig
          cat /usr/share/wenuyos/sdk-version
          test -f /usr/lib/wenuyos/wenuyos-get || { echo "SDK-arkivet saknar wenuyos-get – släpp WenuyOS igen (packaging/release.sh)"; exit 1; }
      - name: Vilka program
        id: which
        run: |
          git config --global --add safe.directory "$PWD"
          is_prog() { [ -f "$1/game.ini" ] || ls "$1"/data/*.desktop >/dev/null 2>&1; }
          if [[ "$GITHUB_REF" == refs/tags/* || "$GITHUB_REF" == refs/heads/slapp/* ]]; then
            tag=${GITHUB_REF_NAME#slapp/}; p=${tag%-v*}
            if [[ "$GITHUB_REF" == refs/heads/slapp/* ]]; then   # bara det som är godkänt: commiten måste finnas på main
              git merge-base --is-ancestor HEAD origin/main || { echo "slapp/$tag pekar på något som inte finns på main – bara godkänd kod släpps"; exit 1; }
            fi
            [[ "$tag" =~ ^[a-z0-9][a-z0-9-]*-v[0-9][0-9A-Za-z.+-]*$ ]] || { echo "Taggen ska vara <program>-v<version>, t.ex. matte-v0.3"; exit 1; }
            is_prog "$p" || { echo "Det finns inget program i mappen $p/"; exit 1; }
            unsigned=""; case "$tag" in *-osignerad|*-unsigned) unsigned=1;; esac
            echo "list=$p" >> "$GITHUB_OUTPUT"; echo "release=$p" >> "$GITHUB_OUTPUT"; echo "unsigned=$unsigned" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = pull_request ]; then base=origin/${{ github.base_ref }}; else base=${{ github.event.before }}; fi
          git cat-file -e "$base" 2>/dev/null || base=$(git rev-list --max-parents=0 HEAD | tail -1)
          list=$(git diff --name-only "$base" HEAD | cut -d/ -f1 | sort -u | while read -r d; do if [ -d "$d" ] && is_prog "$d"; then echo "$d"; fi; done | tr '\n' ' ')
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then list=$(for d in */; do d=${d%/}; if is_prog "$d"; then echo "$d"; fi; done | tr '\n' ' '); fi
          echo "Program att prova: ${list:-inga}"; echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Prova
        if: steps.which.outputs.list != ''
        run: |
          fail=0
          for p in ${{ steps.which.outputs.list }}; do
            echo "::group::$p"
            if [ -f "$p/CMakeLists.txt" ]; then
              /usr/lib/wenuyos/wenuyos-verify --yes --project "$p" || fail=1
              cat "$p/.wenuyos/verify.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            fi
            bash .github/wenuyos-pack.sh "$p" "dist/$p.wapp" || fail=1
            echo "::endgroup::"
          done
          exit $fail
      # Osignerade förhandsfiler från PR sparas tillfälligt som Actions-artefakt, aldrig som Git-källkod.
      - name: Testpaket för PR
        if: github.event_name == 'pull_request' && steps.which.outputs.list != ''
        uses: actions/upload-artifact@v4
        with:
          name: program-test-${{ github.event.pull_request.number }}
          path: dist/*.wapp
          if-no-files-found: error
          retention-days: 7
      - name: Programnyckeln
        # bara på main, i PR och vid släpp: att hemligheten är Daniels programnyckel och kan signera utan lösenfras.
        # Visar bara fingeravtrycket och gpg:s meddelanden – aldrig nyckeln.
        if: github.event_name != 'workflow_dispatch'
        env:
          WENUYOS_PROGRAM_KEY: ${{ secrets.WENUYOS_PROGRAM_KEY }}
        run: |
          [ -n "$WENUYOS_PROGRAM_KEY" ] || { echo "::warning::Hemligheten WENUYOS_PROGRAM_KEY saknas – bara osignerade släpp går"; exit 0; }
          export GNUPGHOME=$(mktemp -d); chmod 700 "$GNUPGHOME"; trap 'rm -rf "$GNUPGHOME"' EXIT
          # inklistring från Windows: BOM, CR, mellanslag i början av raderna, text före/efter blocket – rättas här
          printf '%s\n' "$WENUYOS_PROGRAM_KEY" | python3 .github/wenuyos-key.py > "$GNUPGHOME/k.asc" || exit 1
          echo "Hemligheten: $(wc -l < "$GNUPGHOME/k.asc") rader, $(wc -c < "$GNUPGHOME/k.asc") tecken, rad 2 $( [ -z "$(sed -n 2p "$GNUPGHOME/k.asc")" ] && echo tom || echo 'inte tom'), sista raden: $(grep -c -- '-----END PGP PRIVATE KEY BLOCK-----' "$GNUPGHOME/k.asc") END"
          gpg --batch --import "$GNUPGHOME/k.asc" 2>&1 | grep -v -i "^gpg: directory\|keybox" || true
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')
          echo "Hemlig nyckel i hemligheten: ${fpr:-ingen}"
          [ "$fpr" = A1E9825D3FB6CD49D583377CAC0B0BB79E68D7BA ] || { echo "::error::Hemligheten är inte programnyckeln (…9E68 D7BA) som WenuyOS litar på"; exit 1; }
          echo prov > "$GNUPGHOME/prov.txt"
          gpg --batch --yes --pinentry-mode loopback --passphrase '' --detach-sign "$GNUPGHOME/prov.txt" 2>&1 \
            || { echo "::error::Nyckeln kan inte signera utan lösenfras – exportera den igen utan lösenfras"; exit 1; }
          echo "Programnyckeln fungerar."
      - name: Signera och släpp
        if: steps.which.outputs.release != ''
        env:
          WENUYOS_PROGRAM_KEY: ${{ secrets.WENUYOS_PROGRAM_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          p=${{ steps.which.outputs.release }}; tag=${{ steps.which.outputs.tag }}
          if [ -n "${{ steps.which.outputs.unsigned }}" ]; then
            bash .github/wenuyos-pack.sh "$p" "dist/$p.wapp"   # osignerad: datorerna visar "Inte signerat"
            note="Osignerad version – WenuyOS visar \"Inte signerat\" när den installeras."
          else
            [ -n "$WENUYOS_PROGRAM_KEY" ] || { echo "Hemligheten WENUYOS_PROGRAM_KEY saknas (Settings → Secrets → Actions) – eller släpp osignerat: taggen $tag-osignerad"; exit 1; }
            export GNUPGHOME=$(mktemp -d); chmod 700 "$GNUPGHOME"
            printf '%s\n' "$WENUYOS_PROGRAM_KEY" | python3 .github/wenuyos-key.py | gpg --batch --import
            bash .github/wenuyos-pack.sh "$p" "dist/$p.wapp" --sign
            rm -rf "$GNUPGHOME"; note=""
          fi
          name=$(sed -n 's/^Name\[sv\]=//p' "$p"/data/*.desktop 2>/dev/null | head -1); [ -n "$name" ] || name=$(sed -n 's/^ *title *= *//p' "$p/game.ini" 2>/dev/null | head -1)
          body=$(sed -n 's/^Comment\[sv\]=//p' "$p"/data/*.desktop 2>/dev/null | head -1); [ -n "$note" ] && body="$body"$'\n\n'"$note"
          # GitHub-API direkt (curl) – gh finns inte i debian:trixie
          api=https://api.github.com/repos/$GITHUB_REPOSITORY
          H=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          # finns släppet redan (t.ex. skapat på github.com med taggen) läggs filen dit; annars skapas det – och taggen
          # sätts på den här commiten (target_commitish), också när det startades av grenen slapp/<tagg>
          rel=$(curl -fsS "${H[@]}" "$api/releases/tags/$tag" 2>/dev/null) || rel=$(python3 -c 'import json,sys; print(json.dumps({"tag_name":sys.argv[1],"target_commitish":sys.argv[4],"name":sys.argv[2],"body":sys.argv[3]}))' "$tag" "${name:-$p} ${tag#$p-}" "$body" "$GITHUB_SHA" \
            | curl -fsS -X POST "${H[@]}" "$api/releases" -d @-)
          up=$(printf '%s' "$rel" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"].split("{")[0])')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"dist/$p.wapp" "$up?name=$p.wapp" >/dev/null
          echo "Släppt: $tag – installeras med: wenuyos install github.com/$GITHUB_REPOSITORY#$p" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF" == refs/heads/slapp/* ]]; then   # släppgrenen behövs inte längre
            curl -fsS -X DELETE "${H[@]}" "$api/git/refs/heads/slapp/$tag" || true
          fi
