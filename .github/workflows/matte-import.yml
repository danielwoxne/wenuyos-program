name: Engångsimport av Matte 1.3 (endast PR-grenen)
on:
  push:
    branches:
      - ai/chatgpt/matte
    paths:
      - .github/workflows/matte-import.yml
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/ai/chatgpt/matte'
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Hämta verktyg
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl python3 unzip >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Importera läsbar källkod och endast källtillgångar
        env:
          FOLDER_URL: https://www.dropbox.com/scl/fo/w33txgee3yqt5dubu8gu6/AOC7y4ddGtTMdRGT8KBMmko?rlkey=v6esjs0tm03que76d9bedl6dm&dl=1
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/matte-dropbox /tmp/matte-patch
          curl -fsSL --retry 3 --max-time 240 "$FOLDER_URL" -o /tmp/matte-share.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, is_zipfile
          from pathlib import PurePosixPath
          import os, shutil, subprocess
          root=Path('/tmp/matte-dropbox')
          def safe_unzip(archive, dest):
              if not is_zipfile(archive): raise RuntimeError('Inte en ZIP')
              with ZipFile(archive) as z:
                  infos=[x for x in z.infolist() if not (x.filename=='/' and x.is_dir())]
                  if len(infos)>10000 or sum(x.file_size for x in infos)>250_000_000:
                      raise RuntimeError('För stort importarkiv')
                  for e in infos:
                      p=PurePosixPath(e.filename)
                      if p.is_absolute() or '..' in p.parts or e.filename.startswith('\\'):
                          raise RuntimeError('Otillåten arkivsökväg: ' + repr(e.filename[:180]))
                      if ((e.external_attr>>16)&0o170000)==0o120000:
                          raise RuntimeError('Symlänk i källarkiv')
                  z.extractall(dest, members=infos)
          safe_unzip('/tmp/matte-share.zip',root)
          matches=[p.parent.parent for p in root.rglob('src/Fonster.cpp') if (p.parent.parent/'CMakeLists.txt').is_file()]
          if len(matches)!=1: raise RuntimeError(f'Förväntade exakt en Matte-källa, hittade {len(matches)}')
          source=matches[0]
          patches=list(root.rglob('matte-1.3.0-utvecklingspaket-rev6.zip'))
          if len(patches)!=1: raise RuntimeError(f'Förväntade rev6, hittade {len(patches)}')
          safe_unzip(patches[0], '/tmp/matte-patch')
          scripts=list(Path('/tmp/matte-patch').rglob('patch_matte13_etapp8.py'))
          if len(scripts)!=1: raise RuntimeError('Patchfil saknas eller är tvetydig')
          subprocess.run(['python3',str(scripts[0]),'--root',str(source),'--check'],check=True)
          subprocess.run(['python3',str(scripts[0]),'--root',str(source),'--apply'],check=True)
          # Kopiera endast källfiler, dokumentation och ursprungliga bildtillgångar.
          # Exkluderar byggdata, ZIP/.wapp, Python-cache, plattformsgenererade tillgångar.
          out=Path('matte')
          if out.is_dir(): shutil.rmtree(out)
          allow={'.cpp','.cc','.c','.h','.hpp','.py','.md','.sh','.toml','.json','.txt','.desktop','.svg','.jpg','.jpeg','.png','.po','.pot','.ini','.csv'}
          names={'CMakeLists.txt','LICENSE','.gitignore'}
          dirs=['src','common','innehall','docs','data','tester','verktyg','tests']
          for part in ['CMakeLists.txt','README.md','wenuyos-app.toml']:
              if not (source/part).is_file(): raise RuntimeError(f'Källfil saknas: {part}')
          for item in source.rglob('*'):
              if not item.is_file(): continue
              rel=item.relative_to(source)
              if rel.parts[0] not in dirs and len(rel.parts)>1: continue
              if any(x.startswith('.') or x in ('__pycache__','build','dist','share','target') for x in rel.parts):continue
              if item.suffix.lower() not in allow and item.name not in names: continue
              if item.suffix.lower() in ('.wapp','.zip','.pyc','.so','.o','.a'): continue
              dest=out/rel
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(item,dest)
          if not (out/'data/se.wenuyos.app.matte.desktop').exists():
              raise RuntimeError('Desktop-fil saknas')
          # Behåll koden till reservikonerna som källkod, inte genererade PNG.
          generators=list(Path('/tmp/matte-patch').rglob('generera-saknade-ikoner.py'))
          if len(generators)!=1: raise RuntimeError('Ikongenerator saknas')
          dst=out/'verktyg/generera-saknade-ikoner.py'
          shutil.copy2(generators[0],dst)
          out.joinpath('IMPORT.md').write_text(
              '# Import av Matte 1.3\n\n'
              'Källan importerades från användarens delade Matte 1.2-mapp i Dropbox, '
              'sedan applicerades de åtta tidigare C++-etapperna (rev6). '
              'Den tidigare C++17/GTK4-versionen byggdes i Debian 13 i '
              'New-wenuyos Actions körning 42985630440, men programförrådets '
              'egen CI måste provas separat. Bildrättigheter och verklig '
              'hårdvaruprovning ska granskas före merge.\n',
              encoding='utf-8')
          print('Imported files:',sum(1 for x in out.rglob('*') if x.is_file()))
          PY
          git add -- matte
          git diff --cached --stat | tail -25
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Matte: importera C++17/GTK4-källkod 1.3 och byggbar ikonkälla"
          git push origin HEAD:ai/chatgpt/matte
